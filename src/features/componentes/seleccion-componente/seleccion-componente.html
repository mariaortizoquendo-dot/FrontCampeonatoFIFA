<mat-toolbar>
  <img src="iconos/Seleccion.png">
  <div class="barraTituloCRUD">
    Selecciones del Mundo
  </div>
</mat-toolbar>

<div>
  <mat-form-field appearance="fill">
    <mat-label>Buscar</mat-label>
    <input matInput [(ngModel)]="textoBusqueda">
  </mat-form-field>
  <button matButton="filled" color="primary" (click)="buscar()">Buscar</button>
</div>

<div>
  <button matButton="filled" (click)="agregar()">Agregar</button>
  <button matButton="tonal" (click)="modificar()">Modificar</button>
  <button matButton="outlined" (click)="verificarEliminar()">Eliminar</button>
  <ngx-datatable [headerHeight]="50" [footerHeight]="50"
                 [rows]="selecciones" [columns]="columnas" class="dark" [limit]="10"
                 [columnMode]="modoColumna.force" (activate)="escoger($event)"
                 [selectionType]="'single'">
  </ngx-datatable>
</div>
